<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="5400" viewBox="0 0 1024 5400" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  <title>02 — Landing / Tablet (1024px) | SevaKhata Figma Master</title>
  <defs>
    <style>
      .monumental { font-family: 'Bebas Neue', -apple-system, sans-serif; text-transform: uppercase; }
      .editorial { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .hindi { font-family: 'Noto Sans Devanagari', -apple-system, sans-serif; }
      .tabular { font-feature-settings: 'tnum'; font-variant-numeric: tabular-nums; }
    </style>
    <radialGradient id="hero-seal-radial-tab" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8202B" stop-opacity="0.85"/>
      <stop offset="42%" stop-color="#C8202B" stop-opacity="0.5"/>
      <stop offset="68%" stop-color="#047857" stop-opacity="0.25"/>
      <stop offset="72%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Canvas -->
  <rect id="Canvas / Background" width="1024" height="5400" fill="#0C0C0E"/>
  <line id="Axis / Vertical Center" x1="512" y1="0" x2="512" y2="5400" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Navigation (Tablet 920px) -->
  <g id="Landing / Navigation" transform="translate(52, 14)">
    <rect width="920" height="56" rx="28" fill="#121216" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1"/>
    
    <!-- Brand -->
    <g transform="translate(20, 13)">
      <rect x="0" y="0" width="12" height="30" rx="3" fill="#047857" fill-opacity="0.2" stroke="#047857" stroke-width="1.5"/>
      <rect x="18" y="0" width="12" height="30" rx="3" fill="#047857" fill-opacity="0.2" stroke="#047857" stroke-width="1.5"/>
      <line x1="15" y1="0" x2="15" y2="30" stroke="#E11D48" stroke-width="1.5"/>
      <polygon points="15,10 19,15 15,20 11,15" fill="#059669"/>
      <text x="40" y="21" class="monumental" font-size="19" letter-spacing="0.05em" fill="#FFFFFF">SEVAKHATA</text>
    </g>

    <!-- Center Context -->
    <g transform="translate(340, 32)">
      <circle cx="0" cy="-4" r="3" fill="#059669"/>
      <text x="12" y="0" class="editorial" font-size="11" font-weight="600" fill="#FFFFFF" fill-opacity="0.75">
        Sharma Household × Sunita Sharma
      </text>
    </g>

    <!-- Right Controls -->
    <g transform="translate(790, 12)">
      <rect width="110" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="16" y="20" class="editorial" font-size="12" font-weight="600" fill="#FFFFFF">Open Ledger →</text>
    </g>
  </g>

  <!-- Hero Stage -->
  <g id="Landing / Hero Stage" transform="translate(0, 110)">
    <!-- Disk -->
    <circle cx="512" cy="300" r="230" fill="url(#hero-seal-radial-tab)"/>
    <circle cx="512" cy="300" r="190" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>
    
    <!-- Title -->
    <text x="512" y="230" text-anchor="middle" class="monumental" font-size="140" fill="#FFFFFF" letter-spacing="-0.02em">SEVAKHATA</text>
    
    <g transform="translate(512, 275)">
      <text x="-70" y="0" text-anchor="end" class="editorial" font-size="13" font-weight="800" letter-spacing="0.14em" fill="#FFFFFF">DONO KA RECORD</text>
      <circle cx="0" cy="-4" r="3.5" fill="#E11D48"/>
      <text x="70" y="1" text-anchor="start" class="hindi" font-size="15" font-weight="700" fill="#FFFFFF" fill-opacity="0.85">एक ही हिसाब</text>
    </g>

    <text x="512" y="325" text-anchor="middle" class="editorial" font-size="14" font-weight="400" fill="#FFFFFF" fill-opacity="0.7">
      The shared digital work-and-payment ledger. What both acknowledge becomes the official truth.
    </text>

    <!-- The Living Slab (880px on Tablet) -->
    <g id="Hero / Living Slab" transform="translate(72, 480)">
      <rect width="880" height="630" rx="14" fill="#111115" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="630" rx="2" fill="#E11D48"/>

      <!-- Masthead -->
      <g transform="translate(28, 28)">
        <text x="0" y="18" class="editorial" font-size="18" font-weight="600" fill="#FFFFFF">Sharma Household × Sunita Sharma</text>
        <text x="0" y="38" class="hindi" font-size="12" font-weight="400" fill="#FFFFFF" fill-opacity="0.6">दो फोन · एक साझा हिसाब · अगस्त 2026</text>
        <text x="824" y="22" text-anchor="end" class="editorial" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#FFFFFF" fill-opacity="0.45">AUG 2026</text>
      </g>

      <line x1="4" y1="84" x2="880" y2="84" stroke="#FFFFFF" stroke-opacity="0.06"/>

      <!-- Legend -->
      <g transform="translate(28, 110)">
        <text x="0" y="0" class="editorial" font-size="10" font-weight="700" letter-spacing="0.14em" fill="#FFFFFF" fill-opacity="0.35">DATE</text>
        <text x="110" y="0" class="editorial" font-size="10" font-weight="700" letter-spacing="0.14em" fill="#FFFFFF" fill-opacity="0.35">ENTRY &amp; MUTUAL VERIFICATION</text>
        <text x="690" y="0" text-anchor="end" class="editorial" font-size="10" font-weight="700" letter-spacing="0.14em" fill="#FFFFFF" fill-opacity="0.35">AMOUNT</text>
        <text x="824" y="0" text-anchor="end" class="editorial" font-size="10" font-weight="700" letter-spacing="0.14em" fill="#FFFFFF" fill-opacity="0.35">STATE</text>
      </g>

      <line x1="4" y1="126" x2="880" y2="126" stroke="#FFFFFF" stroke-opacity="0.04"/>

      <!-- Row 1 -->
      <g transform="translate(28, 150)">
        <text x="0" y="15" class="editorial" font-size="12" font-weight="600" fill="#FFFFFF" fill-opacity="0.75">01–10 AUG</text>
        <text x="110" y="14" class="editorial" font-size="13" font-weight="600" fill="#FFFFFF">8 Full Days Housework &amp; Cooking</text>
        <text x="110" y="30" class="editorial" font-size="11" font-weight="400" fill="#FFFFFF" fill-opacity="0.45">Both confirmed · Sharma Ji ✓ &amp; Sunita Didi ✓</text>
        <text x="690" y="18" text-anchor="end" class="editorial tabular" font-size="17" font-weight="700" fill="#FFFFFF">+₹4,000</text>
        <text x="824" y="16" text-anchor="end" class="editorial" font-size="12" font-weight="600" fill="#34D399">Confirmed</text>
      </g>

      <line x1="4" y1="205" x2="880" y2="205" stroke="#FFFFFF" stroke-opacity="0.04"/>

      <!-- Row 2 -->
      <g transform="translate(28, 230)">
        <text x="0" y="15" class="editorial" font-size="12" font-weight="600" fill="#FFFFFF" fill-opacity="0.75">05 AUG</text>
        <text x="110" y="14" class="editorial" font-size="13" font-weight="600" fill="#FFFFFF">Cash Advance (पेसगी)</text>
        <text x="110" y="30" class="editorial" font-size="11" font-weight="400" fill="#FFFFFF" fill-opacity="0.45">School fee assistance · Digital receipt acknowledged</text>
        <text x="690" y="18" text-anchor="end" class="editorial tabular" font-size="17" font-weight="700" fill="#F87171">−₹1,000</text>
        <text x="824" y="16" text-anchor="end" class="editorial" font-size="12" font-weight="600" fill="#FFFFFF" fill-opacity="0.45">Deducted</text>
      </g>

      <line x1="4" y1="285" x2="880" y2="285" stroke="#FFFFFF" stroke-opacity="0.06"/>

      <!-- Active Row -->
      <g transform="translate(4, 285)">
        <rect width="876" height="200" fill="rgba(245, 158, 11, 0.03)"/>
        
        <g transform="translate(24, 24)">
          <circle cx="4" cy="2" r="3" fill="#F59E0B"/>
          <text x="14" y="5" class="editorial" font-size="11" font-weight="800" fill="#F59E0B">TODAY</text>
          <text x="14" y="24" class="editorial" font-size="12" font-weight="600" fill="#FFFFFF" fill-opacity="0.75">13 AUG</text>

          <g transform="translate(110, 0)">
            <text x="0" y="6" class="editorial" font-size="16" font-weight="700" fill="#FFFFFF">Full Day Housework &amp; Cooking</text>
            <text x="0" y="26" class="hindi" font-size="12" font-weight="400" fill="#FFFFFF" fill-opacity="0.75">झाड़ू, पोंछा, बर्तन एवं दोनों समय का खाना · मालिक द्वारा दर्ज</text>
            <text x="0" y="46" class="editorial" font-size="11" font-weight="500" fill="#F59E0B">* Recorded by employer. Holds ₹0.00 until Sunita confirms.</text>
          </g>

          <text x="690" y="16" text-anchor="end" class="editorial tabular" font-size="26" font-weight="900" fill="#FFFFFF">+₹500</text>
          
          <g transform="translate(740, -4)">
            <rect width="84" height="26" rx="13" fill="rgba(245, 158, 11, 0.12)" stroke="#F59E0B" stroke-opacity="0.4"/>
            <text x="42" y="17" text-anchor="middle" class="editorial" font-size="10" font-weight="800" fill="#FBBF24">PENDING</text>
          </g>
        </g>

        <!-- Action Bar -->
        <g transform="translate(24, 130)">
          <line x1="0" y1="0" x2="828" y2="0" stroke="#FFFFFF" stroke-opacity="0.04"/>
          <text x="0" y="24" class="editorial" font-size="11" font-weight="600" fill="#FFFFFF" fill-opacity="0.45">Sunita's Mobile Review:</text>
          <text x="140" y="24" class="hindi" font-size="13" font-weight="600" fill="#FFFFFF">क्या 13 अगस्त का यह काम सही है?</text>

          <g transform="translate(560, 6)">
            <rect width="130" height="42" rx="8" fill="#059669"/>
            <text x="20" y="26" class="editorial" font-size="11" font-weight="700" fill="#FFFFFF">✓ Sahi Hai · <tspan class="hindi">सही है</tspan></text>

            <g transform="translate(138, 0)">
              <rect width="130" height="42" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.2"/>
              <text x="20" y="26" class="editorial" font-size="11" font-weight="700" fill="#FFFFFF" fill-opacity="0.75">✕ Galat Hai · <tspan class="hindi">गलत है</tspan></text>
            </g>
          </g>
        </g>
      </g>

      <!-- Balance Area -->
      <g transform="translate(4, 485)">
        <rect width="876" height="145" fill="#0A0A0E"/>
        <line x1="0" y1="0" x2="876" y2="0" stroke="#FFFFFF" stroke-opacity="0.08"/>
        
        <g transform="translate(24, 30)">
          <text x="0" y="14" class="editorial" font-size="10" font-weight="700" letter-spacing="0.14em" fill="#FFFFFF" fill-opacity="0.45">OFFICIAL SHARED HISAAB · <tspan class="hindi">साझा हिसाब</tspan></text>
          <text x="0" y="38" class="editorial" font-size="12" font-weight="600" fill="#FFFFFF">Confirmed Work (+₹4,000) − Advance (−₹1,000) = ₹3,000 Net Due</text>
          <text x="0" y="58" class="editorial" font-size="11" font-weight="400" fill="#FFFFFF" fill-opacity="0.4">* Today's ₹500 is pending confirmation. Tap "Sahi Hai" to include it.</text>

          <g transform="translate(710, 16)">
            <text x="114" y="20" text-anchor="end" class="editorial tabular" font-size="40" font-weight="900" fill="#FFFFFF">₹3,000</text>
            <g transform="translate(54, 34)">
              <rect width="60" height="20" rx="10" fill="rgba(5, 150, 105, 0.15)" stroke="#059669" stroke-opacity="0.4"/>
              <text x="10" y="14" class="editorial" font-size="10" font-weight="700" fill="#34D399">✓ Sealed</text>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Movement 02: Memory (Stacked on Tablet) -->
  <g id="Movement 02 / Memory Divergence" transform="translate(0, 1480)">
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#FFFFFF" stroke-opacity="0.06"/>
    
    <g transform="translate(72, 80)">
      <text x="0" y="0" class="monumental" font-size="14" fill="#E11D48">02 / 05 — THE UNILATERAL FRACTURE</text>
      <text x="0" y="40" class="editorial" font-size="34" font-weight="800" fill="#FFFFFF">Two separate memories will always create two contradictory balances.</text>
      
      <!-- Employer Card -->
      <g transform="translate(0, 100)">
        <rect width="880" height="230" rx="14" fill="#111115" stroke="#FFFFFF" stroke-opacity="0.1"/>
        <text x="28" y="36" class="editorial" font-size="11" font-weight="800" fill="#F59E0B">01 · EMPLOYER'S PERSPECTIVE</text>
        <text x="28" y="68" class="editorial" font-size="20" font-weight="700" fill="#FFFFFF">The Kitchen Wall Calendar</text>
        <text x="28" y="100" class="editorial" font-size="13" fill="#FFFFFF" fill-opacity="0.65" width="820">
          A pencil tick mark on the kitchen calendar cannot distinguish a full day from a half day or a substitute helper.
        </text>
        <rect x="28" y="130" width="824" height="50" rx="6" fill="#08080A"/>
        <text x="44" y="160" class="editorial" font-size="12" font-style="italic" fill="#FFFFFF">"Did she come in the morning or evening?"</text>
      </g>

      <!-- Helper Card -->
      <g transform="translate(0, 350)">
        <rect width="880" height="230" rx="14" fill="#111115" stroke="#FFFFFF" stroke-opacity="0.1"/>
        <text x="28" y="36" class="editorial" font-size="11" font-weight="800" fill="#059669">02 · HELPER'S PERSPECTIVE</text>
        <text x="28" y="68" class="editorial" font-size="20" font-weight="700" fill="#FFFFFF">The Doorway Advance (पेसगी)</text>
        <text x="28" y="100" class="editorial" font-size="13" fill="#FFFFFF" fill-opacity="0.65" width="820">
          ₹1,000 cash given in a hurry at the doorway during morning rush. No paper slip. No timestamp.
        </text>
        <rect x="28" y="130" width="824" height="50" rx="6" fill="#08080A"/>
        <text x="44" y="160" class="editorial" font-size="12" font-style="italic" fill="#FFFFFF">"Was it for school fees or festival bonus?"</text>
      </g>
    </g>
  </g>

  <!-- Movement 03: Consensus Engine -->
  <g id="Movement 03 / Consensus Engine" transform="translate(0, 2400)">
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#FFFFFF" stroke-opacity="0.06"/>
    
    <g transform="translate(512, 70)">
      <text x="0" y="0" text-anchor="middle" class="monumental" font-size="14" fill="#E11D48">03 / 05 — THE CONSENSUS ENGINE</text>
      
      <!-- Lockup -->
      <g transform="translate(0, 60)">
        <g transform="translate(-150, 0)">
          <text x="0" y="0" text-anchor="middle" class="monumental" font-size="52" fill="#FFFFFF">RECORDED</text>
          <text x="0" y="22" text-anchor="middle" class="editorial" font-size="12" font-weight="700" letter-spacing="0.16em" fill="#FFFFFF" fill-opacity="0.75">BY EMPLOYER</text>
        </g>
        <text x="0" y="8" text-anchor="middle" class="monumental" font-size="44" fill="#E11D48">×</text>
        <g transform="translate(150, 0)">
          <text x="0" y="0" text-anchor="middle" class="monumental" font-size="52" fill="#34D399">REVIEWED</text>
          <text x="0" y="22" text-anchor="middle" class="editorial" font-size="12" font-weight="700" letter-spacing="0.16em" fill="#FFFFFF" fill-opacity="0.75">BY HELPER</text>
        </g>
      </g>
    </g>

    <!-- Stepper Card -->
    <g transform="translate(72, 320)">
      <rect width="880" height="360" rx="14" fill="#111115" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <rect x="0" y="0" width="4" height="360" rx="2" fill="#F59E0B"/>
      
      <g transform="translate(32, 32)">
        <text x="0" y="0" class="editorial" font-size="10" font-weight="800" fill="#FBBF24">⏱ STAGE 01 · PENDING REVIEW (₹0 ON HISAAB)</text>
        <text x="0" y="32" class="editorial" font-size="22" font-weight="700" fill="#FFFFFF">Full Day Housework &amp; Cooking Logged</text>
        <text x="0" y="65" class="editorial" font-size="14" fill="#FFFFFF" fill-opacity="0.7" width="540">
          Sharma Ji logs today’s attendance. Under SevaKhata’s mutual rule, this entry is in strict quarantine.
        </text>

        <g transform="translate(680, 20)">
          <text x="136" y="32" text-anchor="end" class="editorial tabular" font-size="40" font-weight="900" fill="#FFFFFF">+₹500</text>
          <text x="136" y="60" text-anchor="end" class="editorial" font-size="11" font-weight="600" fill="#F59E0B">Weight on Hisaab: ₹0.00</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Movement 04: Shared Hisaab -->
  <g id="Movement 04 / Shared Hisaab" transform="translate(0, 3400)">
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#FFFFFF" stroke-opacity="0.06"/>
    
    <g transform="translate(512, 80)">
      <text x="0" y="0" text-anchor="middle" class="monumental" font-size="14" fill="#E11D48">04 / 05 — THE MATHEMATICAL RESOLUTION</text>
      <text x="0" y="50" text-anchor="middle" class="editorial" font-size="38" font-weight="800" fill="#FFFFFF">The first of the month in complete peace.</text>
      
      <!-- Numeral -->
      <text x="0" y="180" text-anchor="middle" class="monumental tabular" font-size="140" fill="#FFFFFF">₹3,000</text>
      <text x="0" y="225" text-anchor="middle" class="editorial" font-size="12" font-weight="700" fill="#34D399">✓ MUTUALLY CONFIRMED &amp; SEALED</text>
    </g>
  </g>

  <!-- Movement 05: Covenant -->
  <g id="Movement 05 / Covenant" transform="translate(0, 4400)">
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <g transform="translate(512, 80)">
      <text x="0" y="60" text-anchor="middle" class="hindi" font-size="36" font-weight="700" fill="#FFFFFF">अगली पेसगी, रसीद के साथ।</text>
      <text x="0" y="110" text-anchor="middle" class="hindi" font-size="36" font-weight="700" fill="#34D399">अगला महीना, बिना संकोच।</text>
      
      <g transform="translate(-120, 160)">
        <rect width="240" height="50" rx="25" fill="#FFFFFF"/>
        <text x="36" y="31" class="editorial" font-size="13" font-weight="700" fill="#0C0C0E">Open the Shared Khata →</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <g id="Landing / Footer" transform="translate(72, 5280)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <text x="0" y="40" class="monumental" font-size="15" fill="#FFFFFF">SEVAKHATA · <tspan class="hindi">सेवाखाता</tspan></text>
    <text x="880" y="40" text-anchor="end" class="editorial" font-size="10" fill="#FFFFFF" fill-opacity="0.4">© 2026 SevaKhata. All rights reserved.</text>
  </g>
</svg>
