<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  <title>00 — Cover | SevaKhata Figma Master</title>
  <defs>
    <style>
      .monumental { font-family: 'Bebas Neue', -apple-system, sans-serif; letter-spacing: 0.04em; }
      .editorial { font-family: 'Inter', -apple-system, sans-serif; }
      .hindi { font-family: 'Noto Sans Devanagari', 'Inter', sans-serif; }
    </style>
    <radialGradient id="cover-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8202B" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#08080A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect id="Cover / Background" width="1920" height="1080" fill="#08080A"/>
  <circle id="Cover / Radial Glow" cx="960" cy="540" r="600" fill="url(#cover-glow)"/>

  <!-- Architectural Hairline Grid -->
  <line id="Grid / Axis Vertical" x1="960" y1="0" x2="960" y2="1080" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
  <line id="Grid / Axis Horizontal" x1="0" y1="540" x2="1920" y2="540" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
  <circle id="Grid / Ring Outer" cx="960" cy="540" r="420" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="6 8"/>
  <circle id="Grid / Ring Inner" cx="960" cy="540" r="260" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Cover Content Frame -->
  <g id="Cover / Content" transform="translate(240, 240)">
    
    <!-- Brand Mark & Pill -->
    <g id="Cover / Brand Lockup" transform="translate(0, 0)">
      <rect x="0" y="0" width="48" height="48" rx="12" fill="#121216" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1"/>
      <path d="M16 12 H22 V36 H16 Z M26 12 H32 V36 H26 Z" fill="#059669" fill-opacity="0.3" stroke="#059669" stroke-width="1.5"/>
      <line x1="24" y1="10" x2="24" y2="38" stroke="#E11D48" stroke-width="2"/>
      <polygon points="24,20 28,24 24,28 20,24" fill="#059669"/>
      
      <rect x="64" y="8" width="140" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="76" y="29" class="editorial" font-size="12" font-weight="700" letter-spacing="0.14em" fill="#34D399">OFFICIAL DESIGN</text>
    </g>

    <!-- Main Title: SEVAKHATA -->
    <text id="Cover / Title" x="0" y="160" class="monumental" font-size="130" fill="#FFFFFF">SEVAKHATA</text>

    <!-- Bilingual Subtitle -->
    <g id="Cover / Subtitle Lockup" transform="translate(0, 210)">
      <text x="0" y="0" class="editorial" font-size="24" font-weight="800" letter-spacing="0.16em" fill="#FFFFFF">DONO KA RECORD</text>
      <circle cx="270" cy="-7" r="4" fill="#E11D48"/>
      <text x="295" y="2" class="hindi" font-size="26" font-weight="700" fill="#FFFFFF" fill-opacity="0.8">एक ही हिसाब</text>
    </g>

    <!-- Project Narrative -->
    <text id="Cover / Description" x="0" y="280" class="editorial" font-size="18" font-weight="400" fill="#FFFFFF" fill-opacity="0.65" width="800">
      The shared digital work-and-payment ledger between domestic employers and helpers.
    </text>
    <text id="Cover / Axiom" x="0" y="315" class="hindi" font-size="18" font-weight="500" fill="#34D399">
      "जो दोनों मानें, वही हिसाब — The Consensus Engine: Anatomy of a Mutual Record"
    </text>

    <!-- Metadata Grid -->
    <g id="Cover / Metadata" transform="translate(0, 420)">
      <line x1="0" y1="0" x2="900" y2="0" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>

      <!-- Meta Item 1 -->
      <g transform="translate(0, 30)">
        <text x="0" y="0" class="editorial" font-size="11" font-weight="700" letter-spacing="0.16em" fill="#FFFFFF" fill-opacity="0.4">VERSION</text>
        <text x="0" y="25" class="editorial" font-size="16" font-weight="600" fill="#FFFFFF">Final Production 2.0</text>
      </g>

      <!-- Meta Item 2 -->
      <g transform="translate(240, 30)">
        <text x="0" y="0" class="editorial" font-size="11" font-weight="700" letter-spacing="0.16em" fill="#FFFFFF" fill-opacity="0.4">PLATFORMS</text>
        <text x="0" y="25" class="editorial" font-size="16" font-weight="600" fill="#FFFFFF">1440 Desktop · 1024 Tablet · 390 Mobile</text>
      </g>

      <!-- Meta Item 3 -->
      <g transform="translate(620, 30)">
        <text x="0" y="0" class="editorial" font-size="11" font-weight="700" letter-spacing="0.16em" fill="#FFFFFF" fill-opacity="0.4">CORE LOGIC</text>
        <text x="0" y="25" class="editorial" font-size="16" font-weight="600" fill="#34D399">Confirmed ₹3,000 / ₹3,500 Invariant</text>
      </g>
    </g>

  </g>
</svg>
