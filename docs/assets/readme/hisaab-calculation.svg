<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" fill="none">
  <defs>
    <style>
      .monumental { font-family: 'Bebas Neue', -apple-system, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
      .editorial { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .hindi { font-family: 'Noto Sans Devanagari', 'Inter', -apple-system, sans-serif; }
      .tabular { font-feature-settings: 'tnum'; font-variant-numeric: tabular-nums; }
    </style>
    <linearGradient id="hc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E12" />
      <stop offset="100%" stop-color="#060608" />
    </linearGradient>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A22" />
      <stop offset="100%" stop-color="#121216" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1100" height="460" rx="14" fill="url(#hc-bg)" stroke="#27272A" stroke-width="1.5" />

  <!-- Blueprint Lines -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="0" y1="65" x2="1100" y2="65" />
    <line x1="0" y1="210" x2="1100" y2="210" />
    <line x1="0" y1="410" x2="1100" y2="410" />
  </g>

  <!-- Header -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" class="monumental" font-size="24" fill="#FFFFFF">THE SHARED HISAAB MATHEMATICAL FORMULATION</text>
    <text x="0" y="18" class="editorial" font-size="12" fill="#71717A">
      Deterministic formula deriving the official running balance exclusively from mutually acknowledged records.
    </text>
  </g>

  <!-- ==================== CORE FORMULA TILES ==================== -->
  <g transform="translate(50, 85)">
    <!-- TILE 1: CONFIRMED EARNINGS -->
    <rect x="0" y="0" width="170" height="100" rx="8" fill="url(#tile-bg)" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="14" y="22" class="editorial" font-size="10" font-weight="700" fill="#34D399">+ Σ EARNINGS</text>
    <text x="14" y="52" class="monumental" font-size="26" fill="#10B981">WORKED</text>
    <text x="14" y="72" class="editorial" font-size="10" fill="#A1A1AA">Full Day Attendance</text>
    <text x="14" y="86" class="editorial" font-size="10" fill="#6EE7B7">+ Half Day Chores</text>

    <!-- OPERATOR + -->
    <text x="185" y="55" class="editorial" font-size="24" font-weight="700" fill="#71717A" text-anchor="middle">+</text>

    <!-- TILE 2: CONFIRMED BONUSES -->
    <rect x="200" y="0" width="160" height="100" rx="8" fill="url(#tile-bg)" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="14" y="22" class="editorial" font-size="10" font-weight="700" fill="#34D399">+ Σ BONUSES</text>
    <text x="14" y="52" class="monumental" font-size="26" fill="#10B981">BONUSES</text>
    <text x="14" y="72" class="editorial" font-size="10" fill="#A1A1AA">Festival Rewards</text>
    <text x="14" y="86" class="editorial" font-size="10" fill="#6EE7B7">+ Special Overtime</text>

    <!-- OPERATOR ± -->
    <text x="375" y="55" class="editorial" font-size="24" font-weight="700" fill="#71717A" text-anchor="middle">±</text>

    <!-- TILE 3: ADJUSTMENTS -->
    <rect x="390" y="0" width="160" height="100" rx="8" fill="url(#tile-bg)" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="14" y="22" class="editorial" font-size="10" font-weight="700" fill="#38BDF8">± Σ ADJUSTMENTS</text>
    <text x="14" y="52" class="monumental" font-size="26" fill="#38BDF8">ADJUSTMENTS</text>
    <text x="14" y="72" class="editorial" font-size="10" fill="#A1A1AA">Reconciled Deltas</text>
    <text x="14" y="86" class="editorial" font-size="10" fill="#93C5FD">Agreed Rate Delta</text>

    <!-- OPERATOR - -->
    <text x="565" y="55" class="editorial" font-size="24" font-weight="700" fill="#71717A" text-anchor="middle">−</text>

    <!-- TILE 4: PAYMENTS & ADVANCES -->
    <rect x="580" y="0" width="170" height="100" rx="8" fill="url(#tile-bg)" stroke="#E11D48" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="14" y="22" class="editorial" font-size="10" font-weight="700" fill="#FB7185">− Σ PAYMENTS</text>
    <text x="14" y="52" class="monumental" font-size="26" fill="#F43F5E">PAYMENTS</text>
    <text x="14" y="72" class="editorial" font-size="10" fill="#A1A1AA">Salary Disbursements</text>
    <text x="14" y="86" class="editorial" font-size="10" fill="#FDA4AF">+ Cash Advances (Pesgi)</text>

    <!-- OPERATOR = -->
    <text x="765" y="55" class="editorial" font-size="28" font-weight="700" fill="#E4E4E7" text-anchor="middle">=</text>

    <!-- TILE 5: OFFICIAL HISAAB -->
    <rect x="780" y="0" width="220" height="100" rx="8" fill="#1C1420" stroke="#E11D48" stroke-width="1.8" />
    <text x="16" y="22" class="editorial" font-size="10" font-weight="700" fill="#F43F5E">OFFICIAL HISAAB</text>
    <text x="16" y="56" class="monumental" font-size="34" fill="#FFFFFF">CONFIRMED BALANCE</text>
    <text x="16" y="76" class="editorial" font-size="10" font-weight="600" fill="#FB7185">Single Source of Mutual Truth</text>
    <text x="16" y="90" class="hindi" font-size="10" fill="#A1A1AA">साझा हिसाब (जो दोनों मानें)</text>
  </g>

  <!-- ==================== QUARANTINE INVARIANT BOX ==================== -->
  <g transform="translate(50, 205)">
    <rect x="0" y="0" width="1000" height="48" rx="8" fill="#18150E" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="1.2" />
    <circle cx="24" cy="24" r="5" fill="#F59E0B" />
    <text x="38" y="28" class="editorial" font-size="12" font-weight="700" fill="#FBBF24">THE QUARANTINE INVARIANT:</text>
    <text x="210" y="28" class="monumental" font-size="18" fill="#FFFFFF">
      PENDING ENTRIES × ₹0.00 + DISPUTED ENTRIES × ₹0.00 = ₹0.00 LIABILITY
    </text>
    <text x="980" y="28" class="editorial" font-size="11" font-weight="600" fill="#F59E0B" text-anchor="end">
      Strict Invariant ✓
    </text>
  </g>

  <!-- ==================== WORKED EXAMPLE: SHARMA HOUSEHOLD × SUNITA SHARMA ==================== -->
  <g transform="translate(50, 275)">
    <rect x="0" y="0" width="1000" height="120" rx="10" fill="#111116" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    
    <!-- Title inside -->
    <text x="20" y="24" class="editorial" font-size="11" font-weight="700" fill="#D4D4D8">CONCRETE EVALUATION SCENARIO: SHARMA HOUSEHOLD × SUNITA SHARMA (AUGUST 2026)</text>
    
    <!-- Step columns -->
    <g transform="translate(20, 42)">
      <!-- Col 1: Past Confirmed -->
      <rect x="0" y="0" width="220" height="64" rx="6" fill="#181820" />
      <text x="12" y="20" class="editorial" font-size="10" fill="#71717A">1. Historical Records</text>
      <text x="12" y="38" class="editorial" font-size="11" font-weight="600" fill="#FFFFFF">8 Days Work: +₹4,000</text>
      <text x="12" y="52" class="editorial" font-size="11" font-weight="600" fill="#F43F5E">05 Aug Advance: -₹1,000</text>

      <text x="235" y="36" class="editorial" font-size="16" fill="#71717A">──▶</text>

      <!-- Col 2: Baseline -->
      <rect x="255" y="0" width="200" height="64" rx="6" fill="#11221A" stroke="#059669" stroke-width="1" />
      <text x="12" y="20" class="editorial" font-size="10" font-weight="600" fill="#34D399">2. Baseline Balance</text>
      <text x="12" y="44" class="monumental" font-size="24" fill="#34D399">₹3,000</text>
      <text x="12" y="56" class="editorial" font-size="9" fill="#A7F3D0">Confirmed Net Payable</text>

      <text x="470" y="36" class="editorial" font-size="16" fill="#71717A">──▶</text>

      <!-- Col 3: Today Entry -->
      <rect x="490" y="0" width="230" height="64" rx="6" fill="#1C180E" stroke="#F59E0B" stroke-width="1" />
      <text x="12" y="20" class="editorial" font-size="10" font-weight="600" fill="#FBBF24">3. Active 13 Aug Entry (+₹500)</text>
      <text x="12" y="38" class="editorial" font-size="11" fill="#FFFFFF">• In PENDING: Weight = ₹0.00</text>
      <text x="12" y="52" class="editorial" font-size="10" fill="#FBBF24">  Running balance stays ₹3,000</text>

      <text x="735" y="36" class="editorial" font-size="16" fill="#71717A">──▶</text>

      <!-- Col 4: Post Confirm -->
      <rect x="755" y="0" width="205" height="64" rx="6" fill="#1F1018" stroke="#E11D48" stroke-width="1.2" />
      <text x="12" y="20" class="editorial" font-size="10" font-weight="600" fill="#FDA4AF">4. Helper Confirms (सही है)</text>
      <text x="12" y="44" class="monumental" font-size="24" fill="#FFFFFF">₹3,500</text>
      <text x="12" y="56" class="editorial" font-size="9" fill="#F43F5E">Released into Official Hisaab ✓</text>
    </g>
  </g>

  <!-- Footer note -->
  <g transform="translate(50, 425)">
    <text x="0" y="15" class="editorial" font-size="11" fill="#71717A">
      Formula implemented in <tspan fill="#E4E4E7">js/records.js</tspan> (<tspan font-family="monospace">R.balance()</tspan>) and verified via zero-dependency test runner in <tspan fill="#E4E4E7">scripts/smoke-test.js</tspan>.
    </text>
    <text x="1000" y="15" class="editorial" font-size="11" font-weight="600" fill="#10B981" text-anchor="end">
      DETERMINISTIC &amp; AUDITABLE
    </text>
  </g>
</svg>