<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" fill="none">
  <defs>
    <style>
      .monumental { font-family: 'Bebas Neue', -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
      .editorial { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .hindi { font-family: 'Noto Sans Devanagari', 'Inter', -apple-system, sans-serif; }
      .tabular { font-feature-settings: 'tnum'; font-variant-numeric: tabular-nums; }
    </style>
    <!-- Background subtle gradient -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E12" />
      <stop offset="50%" stop-color="#08080A" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="crimson-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="card-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181820" />
      <stop offset="100%" stop-color="#111115" />
    </linearGradient>
    <linearGradient id="crimson-spine-line" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.2" />
      <stop offset="25%" stop-color="#E11D48" stop-opacity="1" />
      <stop offset="75%" stop-color="#E11D48" stop-opacity="1" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Container Box with Rounded Corners and Subtle Border -->
  <rect x="0" y="0" width="1200" height="520" rx="16" fill="url(#hero-bg)" stroke="#27272A" stroke-width="1.5" />

  <!-- Ambient Decorative Atmospheric Lights -->
  <circle cx="240" cy="120" r="180" fill="url(#crimson-glow)" />
  <circle cx="960" cy="140" r="200" fill="url(#emerald-glow)" />

  <!-- Subtle Blueprint Grid Pattern -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="520" />
    <line x1="200" y1="0" x2="200" y2="520" />
    <line x1="320" y1="0" x2="320" y2="520" />
    <line x1="440" y1="0" x2="440" y2="520" />
    <line x1="560" y1="0" x2="560" y2="520" />
    <line x1="680" y1="0" x2="680" y2="520" />
    <line x1="800" y1="0" x2="800" y2="520" />
    <line x1="920" y1="0" x2="920" y2="520" />
    <line x1="1040" y1="0" x2="1040" y2="520" />
    <line x1="1160" y1="0" x2="1160" y2="520" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="380" x2="1200" y2="380" />
    <line x1="0" y1="480" x2="1200" y2="480" />
  </g>

  <!-- ==================== TOP MASTHEAD & BRAND IDENTIFIERS ==================== -->
  <!-- Top Category Chip -->
  <rect x="440" y="32" width="320" height="26" rx="13" fill="#181820" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <circle cx="456" cy="45" r="4" fill="#059669" />
  <text x="470" y="49" class="editorial" font-size="11" font-weight="600" fill="#E4E4E7" letter-spacing="0.06em">BILATERAL WORK &amp; PAYMENT LEDGER</text>

  <!-- Master Brand Title: SEVAKHATA (सेवाखाता) -->
  <g transform="translate(600, 95)">
    <!-- Brand Mark Icon Centered -->
    <g transform="translate(-18, -36) scale(1.15)">
      <path d="M7 6C7 4.89543 7.89543 4 9 4H14.5C15.3284 4 16 4.67157 16 5.5V26.5C16 27.3284 15.3284 28 14.5 28H9C7.89543 28 7 27.1046 7 26V6Z" fill="#047857" fill-opacity="0.25" stroke="#047857" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M25 6C25 4.89543 24.1046 4 23 4H17.5C16.6716 4 16 4.67157 16 5.5V26.5C16 27.3284 16.6716 28 17.5 28H23C24.1046 28 25 27.1046 25 26V6Z" fill="#047857" fill-opacity="0.25" stroke="#047857" stroke-width="1.6" stroke-linejoin="round"/>
      <line x1="16" y1="3" x2="16" y2="29" stroke="#E11D48" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M16 11L19.5 16L16 21L12.5 16L16 11Z" fill="#059669"/>
      <circle cx="16" cy="16" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Main Title -->
    <text x="0" y="16" class="monumental" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      SEVAKHATA <tspan class="hindi" font-size="36" font-weight="600" fill="#F43F5E">· सेवाखाता</tspan>
    </text>

    <!-- Cultural Core Axiom & Tagline -->
    <text x="0" y="44" class="editorial" font-size="16" font-weight="600" fill="#E4E4E7" text-anchor="middle">
      "Dono ka record, ek hi hisaab."
      <tspan class="hindi" font-weight="500" fill="#A1A1AA"> — जो दोनों मानें, वही हिसाब।</tspan>
    </text>
    <text x="0" y="66" class="editorial" font-size="13" font-weight="400" fill="#71717A" text-anchor="middle">
      A two-sided shared work &amp; payment register establishing mutual consensus between households and domestic helpers.
    </text>
  </g>

  <!-- ==================== THREE-PANEL CONSENSUS SHOWCASE ==================== -->

  <!-- PANEL 1: EMPLOYER FOLIO (LEFT) -->
  <g transform="translate(60, 195)">
    <rect x="0" y="0" width="320" height="230" rx="12" fill="url(#card-surface)" stroke="#27272A" stroke-width="1.2" />
    <!-- Header -->
    <rect x="0" y="0" width="320" height="42" rx="12" fill="#1C1C24" />
    <rect x="0" y="30" width="320" height="12" fill="#1C1C24" />
    <circle cx="24" cy="21" r="5" fill="#3B82F6" />
    <text x="38" y="25" class="editorial" font-size="12" font-weight="700" fill="#F4F4F5" letter-spacing="0.04em">EMPLOYER RECORD FOLIO</text>
    <text x="300" y="25" class="editorial" font-size="11" font-weight="500" fill="#71717A" text-anchor="end">Stage 01</text>
    
    <!-- Entry Record Mockup -->
    <rect x="16" y="56" width="288" height="66" rx="8" fill="#111115" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <text x="28" y="76" class="editorial" font-size="11" font-weight="600" fill="#A1A1AA">13 AUG 2026 · DAILY ATTENDANCE</text>
    <text x="28" y="96" class="editorial" font-size="13" font-weight="600" fill="#FFFFFF">Full Day Housework &amp; Cooking</text>
    <text x="288" y="96" class="monumental" font-size="18" fill="#10B981" text-anchor="end">+₹500</text>
    <rect x="28" y="104" width="60" height="12" rx="6" fill="#F59E0B" fill-opacity="0.18" />
    <text x="58" y="113" class="editorial" font-size="9" font-weight="700" fill="#F59E0B" text-anchor="middle">PENDING</text>
    <text x="96" y="113" class="editorial" font-size="10" fill="#71717A">₹0.00 Balance Weight</text>

    <!-- Quarantine Rule Callout -->
    <rect x="16" y="132" width="288" height="42" rx="6" fill="#16161D" stroke="#E11D48" stroke-opacity="0.3" stroke-width="1" />
    <text x="26" y="148" class="editorial" font-size="10" font-weight="700" fill="#F43F5E">QUARANTINE INVARIANT:</text>
    <text x="26" y="163" class="editorial" font-size="10" fill="#A1A1AA">Entry is quarantined until helper acknowledges.</text>

    <!-- Meta bottom -->
    <line x1="16" y1="184" x2="304" y2="184" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="24" y="206" class="editorial" font-size="11" font-weight="500" fill="#71717A">Actor: Household Manager</text>
    <text x="296" y="206" class="editorial" font-size="11" font-weight="600" fill="#3B82F6" text-anchor="end">Created ✓</text>
  </g>

  <!-- CONSENSUS BRIDGE & SPINAL CONNECTOR (CENTER) -->
  <g transform="translate(400, 195)">
    <!-- Central Verification Card -->
    <rect x="0" y="0" width="400" height="230" rx="12" fill="#14141A" stroke="#059669" stroke-opacity="0.4" stroke-width="1.5" />
    <rect x="0" y="0" width="400" height="42" rx="12" fill="#11221A" />
    <rect x="0" y="30" width="400" height="12" fill="#11221A" />
    <circle cx="24" cy="21" r="5" fill="#059669" />
    <text x="38" y="25" class="editorial" font-size="12" font-weight="700" fill="#34D399" letter-spacing="0.04em">BILATERAL CONSENSUS ENGINE</text>
    <text x="376" y="25" class="editorial" font-size="11" font-weight="500" fill="#059669" text-anchor="end">Stage 02 &amp; 03</text>

    <!-- Flow indicator graphic -->
    <g transform="translate(20, 56)">
      <!-- Left arrow in -->
      <line x1="10" y1="20" x2="90" y2="20" stroke="#E11D48" stroke-width="2" stroke-dasharray="4 3" />
      <polygon points="90,16 98,20 90,24" fill="#E11D48" />

      <!-- Center Seal Badge -->
      <g transform="translate(180, 20)">
        <circle cx="0" cy="0" r="28" fill="#059669" fill-opacity="0.15" stroke="#059669" stroke-width="1.5" />
        <path d="M0 -12L9 0L0 12L-9 0Z" fill="#059669" />
        <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
      </g>

      <!-- Right arrow out -->
      <line x1="270" y1="20" x2="350" y2="20" stroke="#059669" stroke-width="2" stroke-dasharray="4 3" />
      <polygon points="350,16 358,20 350,24" fill="#059669" />
    </g>

    <text x="200" y="112" class="editorial" font-size="11" font-weight="600" fill="#A1A1AA" text-anchor="middle">
      MUTUAL ACKNOWLEDGEMENT GATEWAY
    </text>

    <!-- Consensus Math Live Box -->
    <rect x="24" y="126" width="352" height="52" rx="8" fill="#0C0C0E" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="40" y="146" class="editorial" font-size="10" font-weight="600" fill="#71717A">BASELINE CONFIRMED:</text>
    <text x="40" y="166" class="monumental" font-size="20" fill="#E4E4E7">₹3,000</text>
    <text x="160" y="156" class="editorial" font-size="18" fill="#71717A">+</text>
    <text x="190" y="146" class="editorial" font-size="10" font-weight="600" fill="#059669">CONFIRMED (सही है):</text>
    <text x="190" y="166" class="monumental" font-size="20" fill="#10B981">+₹500</text>
    <text x="280" y="156" class="editorial" font-size="18" fill="#71717A">=</text>
    <text x="310" y="146" class="editorial" font-size="10" font-weight="600" fill="#F43F5E">OFFICIAL HISAAB:</text>
    <text x="310" y="166" class="monumental" font-size="20" fill="#F43F5E">₹3,500</text>

    <!-- Invariant footer -->
    <text x="200" y="206" class="editorial" font-size="11" font-weight="500" fill="#9CA3AF" text-anchor="middle">
      ✓ Disputed/Pending entries strictly hold ₹0.00 balance weight
    </text>
  </g>

  <!-- PANEL 3: HELPER REVIEW FOLIO (RIGHT) -->
  <g transform="translate(820, 195)">
    <rect x="0" y="0" width="320" height="230" rx="12" fill="url(#card-surface)" stroke="#27272A" stroke-width="1.2" />
    <!-- Header -->
    <rect x="0" y="0" width="320" height="42" rx="12" fill="#1C1C24" />
    <rect x="0" y="30" width="320" height="12" fill="#1C1C24" />
    <circle cx="24" cy="21" r="5" fill="#10B981" />
    <text x="38" y="25" class="editorial" font-size="12" font-weight="700" fill="#F4F4F5" letter-spacing="0.04em">HELPER MOBILE REVIEW</text>
    <text x="300" y="25" class="editorial" font-size="11" font-weight="500" fill="#71717A" text-anchor="end">Stage 04</text>

    <!-- Mobile review prompt in Hindi -->
    <rect x="16" y="56" width="288" height="52" rx="8" fill="#111115" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <text x="28" y="74" class="hindi" font-size="11" font-weight="600" fill="#A1A1AA">13 अगस्त · काम की हाज़िरी</text>
    <text x="28" y="94" class="hindi" font-size="13" font-weight="600" fill="#FFFFFF">पूरा दिन का काम (₹500)</text>
    <text x="288" y="94" class="editorial" font-size="11" font-weight="600" fill="#F59E0B" text-anchor="end">जाँच करें</text>

    <!-- Dual Actions (Confirm vs Dispute) -->
    <g transform="translate(16, 120)">
      <!-- Confirm Button -->
      <rect x="0" y="0" width="138" height="48" rx="8" fill="#047857" fill-opacity="0.25" stroke="#059669" stroke-width="1.4" />
      <text x="69" y="23" class="hindi" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">सही है (✓)</text>
      <text x="69" y="38" class="editorial" font-size="10" font-weight="500" fill="#A7F3D0" text-anchor="middle">Sahi Hai · Confirm</text>

      <!-- Dispute Button -->
      <rect x="150" y="0" width="138" height="48" rx="8" fill="#BE123C" fill-opacity="0.2" stroke="#E11D48" stroke-width="1.4" />
      <text x="219" y="23" class="hindi" font-size="12" font-weight="700" fill="#FB7185" text-anchor="middle">गलत है (✕)</text>
      <text x="219" y="38" class="editorial" font-size="10" font-weight="500" fill="#FECDD3" text-anchor="middle">Galat Hai · Dispute</text>
    </g>

    <!-- Meta bottom -->
    <line x1="16" y1="184" x2="304" y2="184" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="24" y="206" class="editorial" font-size="11" font-weight="500" fill="#71717A">Actor: Domestic Worker</text>
    <text x="296" y="206" class="editorial" font-size="11" font-weight="600" fill="#10B981" text-anchor="end">Symmetric Rights ✓</text>
  </g>

  <!-- ==================== BOTTOM STATUS BAR & TECH BADGES ==================== -->
  <g transform="translate(60, 452)">
    <rect x="0" y="0" width="1080" height="42" rx="8" fill="#111116" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    
    <!-- Left telemetry -->
    <circle cx="20" cy="21" r="4" fill="#059669" />
    <text x="32" y="25" class="editorial" font-size="11" font-weight="600" fill="#D4D4D8">STATUS: EVALUATION 2 VERIFIED</text>
    <text x="250" y="25" class="editorial" font-size="11" fill="#71717A">|</text>
    <text x="270" y="25" class="editorial" font-size="11" font-weight="500" fill="#A1A1AA">6 Workflows + 1 Login Folio</text>
    <text x="450" y="25" class="editorial" font-size="11" fill="#71717A">|</text>
    <text x="470" y="25" class="editorial" font-size="11" font-weight="500" fill="#A1A1AA">Atomic Local JSON Storage</text>
    <text x="655" y="25" class="editorial" font-size="11" fill="#71717A">|</text>
    <text x="675" y="25" class="editorial" font-size="11" font-weight="500" fill="#A1A1AA">8 Figma Vector Artboards</text>

    <!-- Right link badge -->
    <text x="1060" y="25" class="editorial" font-size="11" font-weight="600" fill="#059669" text-anchor="end">ZERO-DEPENDENCY RUNTIME</text>
  </g>
</svg>