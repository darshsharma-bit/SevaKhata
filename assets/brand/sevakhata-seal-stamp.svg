<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Circular Path for Text -->
    <path id="seal-text-path" d="M 60, 60 m -44, 0 a 44,44 0 1,1 88,0 a 44,44 0 1,1 -88,0" />
  </defs>

  <!-- Outer Fine Boundary -->
  <circle cx="60" cy="60" r="56" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" stroke-dasharray="2 3" />
  <circle cx="60" cy="60" r="51" stroke="rgba(255, 255, 255, 0.12)" stroke-width="0.75" />

  <!-- Circular Rotating Text -->
  <text font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.18em" fill="rgba(255, 255, 255, 0.85)">
    <textPath href="#seal-text-path" startOffset="0%">
      • JO DONO MAANE • WAHI HISAAB • SEVAKHATA 2026 •
    </textPath>
  </text>

  <!-- Center Core Seal -->
  <circle cx="60" cy="60" r="28" fill="#047857" fill-opacity="0.15" stroke="#047857" stroke-width="1.2" />
  <circle cx="60" cy="60" r="24" fill="#047857" fill-opacity="0.25" />
  
  <!-- Central Mutual Diamond -->
  <path d="M60 48L68 60L60 72L52 60Z" fill="#059669" />
  <circle cx="60" cy="60" r="2.5" fill="#FFFFFF" />
  
  <!-- Red Ledger Spine Accent -->
  <line x1="60" y1="36" x2="60" y2="44" stroke="#E11D48" stroke-width="1.5" stroke-linecap="round" />
  <line x1="60" y1="76" x2="60" y2="84" stroke="#E11D48" stroke-width="1.5" stroke-linecap="round" />
</svg>
